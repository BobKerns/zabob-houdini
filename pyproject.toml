[project]
name = "zabob-houdini"
version = "0.1.3"
description = "A simple API for creating Houdini node graphs programmatically"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Bob Kerns", email = "1154903+BobKerns@users.noreply.github.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["houdini", "3d", "graphics", "procedural", "node-graph", "vfx"]
dependencies = [
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.0.0",
    "requests>=2.32.5",
    "semver>=3.0.4",
    "charset-normalizer<3.4.0",
    "importlib-metadata>=8.7.0",
]

[project.urls]
Homepage = "https://github.com/BobKerns/zabob-houdini"
Repository = "https://github.com/BobKerns/zabob-houdini"
Issues = "https://github.com/BobKerns/zabob-houdini/issues"
Documentation = "https://github.com/BobKerns/zabob-houdini#readme"

[project.scripts]
zabob-houdini = "zabob_houdini.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
exclude = [
    "src/testing",
]
packages = ["src/zabob_houdini", "src/zabob_loader"]

[tool.hatch.build.targets.wheel.force-include]
"src/zzz_dynamic_imports.pth" = "zzz_dynamic_imports.pth"
"src/_install_zabob_loader.py" = "z_install_zabob_loader.py"


[dependency-groups]
dev = [
    "build>=1.3.0",
    "mypy>=1.19.0",
    "twine>=6.2.0",
    "pytest-cov>=7.0.0",
    "coverage>=7.12.0",
    "hatchling>=1.28.0",
    "hatch-fancy-pypi-readme>=25.1.0",
]
release = [
    "keepachangelog>=2.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (requires Houdini)",
    "unit: marks tests as unit tests (no external dependencies)",
    "slow: marks tests as slow running",
]

[tool.coverage.run]
data_file = ".coverage"
source = ["zabob_houdini", "testing"]
parallel = true
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/stubs/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true
fail_under = 80
precision = 2

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.paths]
source = [
    "src/zabob_houdini",
    "*/zabob_houdini",
    "*/src/zabob_houdini",
]
testing = [
    "src/testing",
    "*/testing",
    "*/src/testing",
]

filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.mypy]
mypy_path = "stubs"
ignore_missing_imports = true
show_error_codes = true
warn_unused_ignores = true

